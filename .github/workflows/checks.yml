name: Core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    name: Core checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install flask==3.1.2 ruff==0.14.4
      - run: npm run build && npm test && npm run check && node tools/icon-cost.mjs && npm run format:check
      - run: python3 tools/package.py --output /tmp/core-first && python3 tools/package.py --output /tmp/core-second && diff -r /tmp/core-first /tmp/core-second
  browser:
    name: Browser checks (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm ci && npm run build
      - run: pip install playwright==1.58.0
      - run: playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/search_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/toc_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/calendar_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/date_validity_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/search_reopen_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/login_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/login_performance_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/icons_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/loading_navigation_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/panels_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: python tests/auth_shell_browser.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
